# others.yml — fundamentals for every NSE stock outside the 3 lists → Nifty_Others_Fundamentals.csv
#
# In two halves, because screener.in slows to minutes per stock after ~1,000 stocks from one machine:
#   Sunday 02:00 IST → first half (symbols A…, sorted)   Sunday 04:00 IST → second half (2 hours later)
# (the 3 main lists are scraped by cron.yml's full run, Sunday 00:00 IST). Each half updates only its own rows.
# Both halves share the concurrency group below, so half 2 waits if half 1 is still running at 02:00.
# By hand: Actions tab → Run workflow → pick half 1, 2 or all.
#   others.py: refreshes EQUITY_L.csv (NSE's list of every company), takes the companies in none of the 3 lists,
#   scrapes them from screener.in with n500.py's engine (same circuit breaker: if screener stops answering, it stops
#   and keeps last week's rows) and upserts Nifty_Others_Fundamentals.csv.
# Then it commits the two CSVs and asks cron.yml for a build + deploy (mode -1), so the site's "Others" list
# updates without waiting for the next scheduled build.
name: Others fundamentals
run-name: "${{ github.event_name == 'schedule' && format('Back-up check {0}', github.event.schedule) || format('Others half {0}', inputs.half || '1') }}"

permissions:
  contents: write
  actions: write            # to start cron.yml's build afterwards

concurrency:
  group: others-scrape
  cancel-in-progress: false

on:
  # Sunday 02:00 IST half 1, 04:00 IST half 2: started by the Oracle server's crontab (oracle/trigger.sh)
  # 🛟 BACK-UP (GitHub's clock, UTC), 2 hours after each Oracle time: runs that half only if Oracle didn't start it
  schedule:
    - cron: "30 22 * * 6"      # Sunday 04:00 IST: half 1 (Oracle 02:00) not started → half 1
    - cron: "30 0 * * 0"       # Sunday 06:00 IST: half 2 (Oracle 04:00) not started → half 2
  workflow_dispatch:
    inputs:
      half:
        description: "Which half: 1, 2 or all"
        required: false
        type: choice
        default: "1"
        options: ["1", "2", "all"]
      limit:
        description: "Test: scrape only this many stocks (blank = all)"
        required: false
        default: ""

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.g.outputs.go || 'true' }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'schedule'
        with:
          sparse-checkout: .github/oracle_guard.sh
          sparse-checkout-cone-mode: false
      - name: Did the Oracle server start it?
        if: github.event_name == 'schedule'
        id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          H=1; [ "${{ github.event.schedule }}" = "30 0 * * 0" ] && H=2
          bash .github/oracle_guard.sh others.yml 135 "^Others half ($H|all)"

  others:
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install requests pandas numpy beautifulsoup4 lxml tqdm

      - name: "🔎 Scrape the others"
        run: |
          SCHED="${{ github.event.schedule }}"
          HALF="${{ github.event.inputs.half }}"
          if [ "$SCHED" = "30 22 * * 6" ]; then HALF=1; fi     # back-up runs
          if [ "$SCHED" = "30 0 * * 0" ];  then HALF=2; fi
          ARGS=""
          if [ "$HALF" = "1" ] || [ "$HALF" = "2" ]; then ARGS="--half $HALF"; fi
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          echo "schedule='$SCHED' half='$HALF'"
          echo "others.py $ARGS   (IST now: $(TZ=Asia/Kolkata date '+%a %d %b %H:%M'))"
          python -u others.py $ARGS

      - name: Commit & push
        if: always()
        run: |
          git config --global user.name  "github-actions"
          git config --global user.email "actions@github.com"
          [ -f EQUITY_L.csv ] && git add EQUITY_L.csv
          if [ -f Nifty_Others_Fundamentals.csv ] && ! git diff --quiet -- Nifty_Others_Fundamentals.csv; then
            TZ=Asia/Kolkata date '+%Y-%m-%dT%H:%M+05:30' > others_built.txt     # when the CSV was written (PF Builder shows it)
            git add Nifty_Others_Fundamentals.csv others_built.txt
          fi
          [ -f old_csv.zip ] && git add old_csv.zip
          git diff --cached --quiet && { echo "Nothing new to commit"; exit 0; }
          git commit -m "Others fundamentals update (half ${{ github.event.inputs.half || 'scheduled' }}) [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin main; then echo "Pushed"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::warning::Could not push (main kept changing)."

      - name: "🏗 Ask cron.yml for a build + deploy"
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cron.yml --ref main -f force_full=-1
