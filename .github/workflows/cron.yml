name: Smart Build & Deploy

permissions:
  contents: write

# never let two runs commit at the same time (a light run waits for the weekly full run)
concurrency:
  group: smart-build
  cancel-in-progress: false

on:
  # Timetable: started by the Oracle server's crontab (oracle/trigger.sh, exact times; GitHub's own schedule ran late
  # or twice). Saturday 00:00 IST full (1) · Saturday 02:00 / 04:00 / 06:00 prices parts 1-3 (2) · 00:00 every other
  # night and 09:15 / 10:15 / 13:15 / 13:30 on trading days: build + deploy (3).
  # 📰 News from the Oracle server (oracle/news.sh, every 2 hours): its push of multi_stock_news.csv → build + deploy only.
  #    This workflow's own commits never start it again (they use GITHUB_TOKEN and say [skip ci]).
  push:
    branches: [main]
    paths: [multi_stock_news.csv]

  workflow_dispatch:
    inputs:
      force_full:
        description: "Run mode:  0 = light (news here + build)  |  1 = FULL scrape (no prices)  |  -1 = build + push only  |  2 = Angel prices only  |  3 = scheduled light (build, no news)  |  4 = ETF only (Angel ETF prices + momentum → builder_etf.json → deploy)"
        required: false
        type: choice
        default: "0"
        options:
          - "0"
          - "1"
          - "-1"
          - "2"
          - "3"
          - "4"
      price_part:
        description: "Only for mode 2 — which third of the stocks:  1 = first  |  2 = middle  |  3 = last"
        required: false
        type: choice
        default: "1"
        options:
          - "1"
          - "2"
          - "3"

jobs:
  build:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 from 19 Oct 2026
    timeout-minutes: 330          # full run ≈ 1–1.5 h (≈1,250 stocks × 2 pages); GitHub max is 360
    env:
      # Telegram creds come from Settings → Secrets and variables → Actions (never written in this file)
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}   # Secrets tab first, falls back to Variables tab
      TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}

    steps:
      # ───────────────────────────────────────────
      # 1. SETUP
      # ───────────────────────────────────────────
      # ref: main = the newest commit when this job STARTS. A price part queued behind the 00:00 full run
      # (same concurrency group) then sees that run's fresh CSVs and data date, not last week's.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install requests pandas numpy beautifulsoup4 lxml tqdm gnews

      # ───────────────────────────────────────────
      # 2. DECIDE MODE
      #    Manual run (force_full):
      #       1  → full   (archive + scrape the 3 lists + build; no news, NO Angel prices)
      #       0  → light  (news + build; scheduled light runs = build only, news comes from the Oracle server)
      #    Push of multi_stock_news.csv (Oracle server) → news (build + deploy only, no Telegram message)
      #      -1  → build  (build only, no news, no scrape)
      #       2  → prices (Angel prices for one third, picked in price_part; nothing else: no build, no deploy)
      #       4  → etf    (ONLY the Portfolio Builder's ETFs + NIFTY 500 benchmark: Angel prices + momentum (3M / 6M / 12-1M,
      #                    now and 1Y back) → prices.csv rows → public/builder_etf.json → commit → Firebase deploy.
      #                    No scrape, no news, no screener / fundamentals rebuild; every other prices.csv row stays.
      #                    The monthly ETF-pair scores in builder_etf.json also need every STOCK's monthly momentum: those
      #                    columns are written by the stock price runs (mode 2, parts 1-3), Saturday 02:00 / 04:00 / 06:00 IST)
      #    Schedule:
      #       Saturday 00:00 IST → full · Saturday 02:00 / 04:00 / 06:00 IST → prices part 1 / 2 / 3 · every other → light
      #
      #    PRICE PARTS (scheduled): the part is chosen from the actual IST clock time, NOT from the cron string.
      #    GitHub sometimes reports the same cron string for different triggers (run #1141 at 04:28 IST said
      #    '30 20 * * 5' = the 02:00 cron), which made part 1 run twice and parts 2/3 never.
      #    The cron string is only used to know "this is one of the three price triggers":
      #       IST hour 1-3  → part 1   (02:00 slot, may start late)
      #       IST hour 4-5  → part 2   (04:00 slot)
      #       IST hour 6-9  → part 3   (06:00 slot)
      #    If part 1 is delayed past 04:00 IST (e.g. stuck behind a very long full run) it would be taken as part 2:
      #    widen the windows below if that ever happens.
      # ───────────────────────────────────────────
      - name: Decide run mode
        id: mode
        run: |
          FORCE="${{ github.event.inputs.force_full }}"
          EVENT="${{ github.event_name }}"
          SCHED="${{ github.event.schedule }}"
          echo "event=$EVENT schedule='$SCHED' force=$FORCE  IST now: $(TZ=Asia/Kolkata date '+%a %d %b %H:%M')"

          PART="${{ github.event.inputs.price_part }}"

          # scheduled price triggers → part chosen from the IST hour (see note above)
          case "$SCHED" in
            "30 20 * * 5"|"30 22 * * 5"|"30 0 * * 6")
              H=$(TZ=Asia/Kolkata date +%-H)
              if   [ "$H" -ge 1 ] && [ "$H" -le 3 ]; then P=1
              elif [ "$H" -ge 4 ] && [ "$H" -le 5 ]; then P=2
              elif [ "$H" -ge 6 ] && [ "$H" -le 9 ]; then P=3
              else
                # outside every window: fall back to the cron string
                case "$SCHED" in
                  "30 20 * * 5") P=1 ;;
                  "30 22 * * 5") P=2 ;;
                  *)             P=3 ;;
                esac
              fi
              echo "PRICE PART chosen: $P  (IST hour $H, cron '$SCHED')"
              echo "mode=prices" >> $GITHUB_OUTPUT; echo "part=$P" >> $GITHUB_OUTPUT; exit 0 ;;
          esac
          echo "part=${PART:-1}" >> $GITHUB_OUTPUT

          # the Oracle server pushed fresh news → just build + deploy
          if [ "$EVENT" = "push" ]; then echo "mode=news" >> $GITHUB_OUTPUT; exit 0; fi

          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$FORCE" in
              1)  echo "mode=full"  >> $GITHUB_OUTPUT ;;
              -1) echo "mode=build" >> $GITHUB_OUTPUT ;;
              2)  echo "mode=prices" >> $GITHUB_OUTPUT ;;       # Angel prices only: fetch + commit prices.csv, no scrape / build / deploy
              3)  echo "mode=light"  >> $GITHUB_OUTPUT ;;       # Oracle timetable: light run without news (news comes from the server)
              4)  echo "mode=etf"    >> $GITHUB_OUTPUT ;;       # ETF prices + momentum only → builder_etf.json → deploy
              *)  echo "mode=light" >> $GITHUB_OUTPUT ;;
            esac
            exit 0
          fi

          if [ "$EVENT" = "schedule" ] && [ "$SCHED" = "30 18 * * 5" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT; exit 0
          fi

          echo "mode=light" >> $GITHUB_OUTPUT

      # ───────────────────────────────────────────
      # 3. RUN SCRIPTS
      #    archive_csv.py → snapshots the 3 CSVs into old_csv.zip as DDMMYY_<name>.csv
      #                     and moves any loose dated CSV into the zip
      #    n500 / nm250 / ns500 → scrape standalone + consolidated (parallel), merge,
      #                     upsert into the master CSV (each also snapshots its own CSV first)
      #    fetch_prices.py → prices.csv (Angel One: latest close, close 1 year back, 52W highs, splits)
      #    build.py → public/index.html + public/fundamentals.html
      # ───────────────────────────────────────────
      # NSE's list of every listed company (EQUITY_L.csv, repo root): the Portfolio's symbol hints for stocks
      # outside the 3 lists, and the "Others" list scraped by others.yml. Best effort: on failure the old file stays.
      - name: "📃 NSE equity list (EQUITY_L.csv)"
        if: steps.mode.outputs.mode != 'prices' && steps.mode.outputs.mode != 'etf'
        continue-on-error: true
        timeout-minutes: 3
        run: python others.py --list-only

      - name: "🚀 Full run (1) — scrape"
        if: steps.mode.outputs.mode == 'full'
        run: |
          python archive_csv.py
          python n500.py
          python nm250.py
          python ns500.py

      # Angel prices (fetch_prices.py → prices.csv): ONLY in prices mode (2), one third of the stocks per run:
      #   Saturday 02:00 / 04:00 / 06:00 IST → part 1 / 2 / 3 (after the 00:00 full scrape), or by hand with mode 2 + price_part.
      #   Each part updates its own rows in prices.csv; the other thirds' rows stay. The full run (1) no longer fetches prices.
      #   The site picks the new prices up at the next build (the light run at Sunday 00:00 IST).
      # Broker credentials go ONLY to this step (not job-wide), so npm / firebase never see them.
      - name: "📈 Fetch prices (Angel) — part ${{ steps.mode.outputs.part }} of 3"
        id: fetchpx
        if: steps.mode.outputs.mode == 'prices' && hashFiles('fetch_prices.py') != ''
        continue-on-error: true
        timeout-minutes: 60         # ≈ 1.2 s per symbol: ~600 symbols per third ≈ 12–15 min
        env:
          ANGEL_API_KEY:     ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN:         ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: |
          pip install smartapi-python pyotp logzero websocket-client
          python archive_csv.py
          python -u fetch_prices.py --part ${{ steps.mode.outputs.part }}

      # ── Mode 4: ETF only ──────────────────────────────────────────────────────────────────────────────
      # fetch_prices.py --etf-only: just ETF_SYMS + the NIFTY 500 benchmark (8 symbols, ~1 min). Their rows in prices.csv are
      # replaced; the other ~2,600 rows stay. NOT continue-on-error: if Angel fails, the run stops here and nothing is deployed.
      - name: "📈 ETF only (4) — fetch Angel prices + momentum"
        id: fetchetf
        if: steps.mode.outputs.mode == 'etf' && hashFiles('fetch_prices.py') != ''
        timeout-minutes: 20
        env:
          ANGEL_API_KEY:     ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN:         ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: |
          pip install smartapi-python pyotp logzero websocket-client
          python -u fetch_prices.py --etf-only

      # rewrites ONLY public/builder_etf.json from prices.csv (build.py --etf-only exits 1 if no ETF got a price)
      - name: "🏗 ETF only (4) — build builder_etf.json"
        if: steps.mode.outputs.mode == 'etf'
        run: python build.py --etf-only

      # weekly composite momentum of NIFTYIT/GOLDBEES and ALPHA/GOLDBEES (never fails the run; skips if the CSVs are missing)
      - name: "📅 ETF weekly composite momentum"
        if: steps.mode.outputs.mode == 'etf'
        run: python etf_weekly_momentum.py --dir . --out . || true

      # momentum table in the log + one-line result for Telegram
      - name: "📊 ETF momentum summary"
        id: esum
        if: steps.mode.outputs.mode == 'etf'
        continue-on-error: true
        run: |
          python - <<'EOF'
          import json, os
          d = json.load(open("public/builder_etf.json"))
          f = lambda v: "  n/a " if v is None else f"{v:6.1f}"
          print(f"{'ETF':<12}{'LTP':>10}  {'3M':>6}{'6M':>7}{'12-1':>7}   | 1Y back: {'3M':>6}{'6M':>7}{'12-1':>7}   {'1Y ret':>7}  date")
          rows = list(d["etf"].items()) + ([("^NIFTY500", d["bench"])] if d.get("bench") else [])
          for s, x in rows:
              m, b = x.get("mom") or [None]*3, x.get("momBack") or [None]*3
              print(f"{s:<12}{(x.get('ltp') or 0):>10,.2f}  {f(m[0])}{f(m[1])}{f(m[2])}   |           {f(b[0])}{f(b[1])}{f(b[2])}   {f(x.get('ret1y'))}%  {x.get('ltpDate')}")
          from fetch_prices import ETF_SYMS
          miss = [e for e in ETF_SYMS if e not in d["etf"]]
          g = d["etf"].get("GOLDBEES") or {}
          n_sc = sum(1 for v in (g.get("scoreM") or []) if v is not None)
          msg = (f"{len(d['etf'])} of {len(ETF_SYMS)} ETFs priced (as of {d.get('asOf')}); monthly momentum scores {n_sc}/13"
                 + (f"; missing: {', '.join(miss)}" if miss else ""))
          if n_sc < 13:
              print("NOTE: the 1-year backtest re-scores the ETF pairs every month from the STOCKS' monthly momentum, which only the")
              print("      stock price runs write (mode 2, parts 1-3 = Saturday 02:00 / 04:00 / 06:00 IST). Run mode 2 parts 1, 2, 3 once.")
          print(msg)
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"msg={msg}\n")
          EOF

      # summary of prices.csv (counts + first rows) in the log, and a one-line result for Telegram
      - name: "📊 prices.csv summary"
        id: psum
        if: steps.mode.outputs.mode == 'prices'
        continue-on-error: true
        run: |
          if [ ! -f prices.csv ]; then echo "prices.csv was NOT written"; echo "msg=prices.csv was NOT written — check the Fetch prices step log" >> $GITHUB_OUTPUT; exit 0; fi
          python - <<'EOF'
          import os, pandas as pd
          d = pd.read_csv("prices.csv")
          st = d["STATUS"].fillna("").astype(str)
          ok, nl = int(st.eq("OK").sum()), int(st.str.startswith("NOT LISTED").sum())
          fail = len(d) - ok - nl
          ca = int(d["CORP_ACTIONS"].fillna("").astype(str).str.len().gt(0).sum())
          b = d[d["SYMBOL"] == "^NIFTY500"]
          bench = f"NIFTY 500 {b['LTP'].iloc[0]} vs {b['PRICE_1Y'].iloc[0]} 1Y back" if len(b) and pd.notna(b["LTP"].iloc[0]) else "NIFTY 500 not found"
          msg = f"{len(d)} rows: {ok} OK, {nl} listed after the 1Y-back date, {fail} failed; {ca} splits/bonuses; {bench}"
          print(msg)
          print(d.head(8).to_string())
          print("Failed examples:", d[~st.eq("OK") & ~st.str.startswith("NOT LISTED")][["SYMBOL","STATUS"]].head(10).to_string(index=False))
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"msg={msg}\n")
          EOF

      - name: "🏗 Full run (1) — build"
        if: steps.mode.outputs.mode == 'full'
        run: |
          python build.py

      # News now comes from the Oracle server (oracle/news.sh). Scheduled light runs only build;
      # a manual run with 0 still scans news here too (backup for when the server is down).
      - name: "⚡ Light run — build (0)"
        if: steps.mode.outputs.mode == 'light'
        run: |
          if [ "${{ github.event.inputs.force_full }}" = "0" ]; then python -u fetch_news.py; fi   # by hand with 0 only
          python build.py

      - name: "🔨 Build only (-1 / news from Oracle)"
        if: steps.mode.outputs.mode == 'build' || steps.mode.outputs.mode == 'news'
        run: |
          python build.py

      # ───────────────────────────────────────────
      # 4. COMMIT & PUSH (all modes)
      # ───────────────────────────────────────────
      - name: Commit & push changes
        if: always()
        continue-on-error: true
        run: |
          git config --global user.name  "github-actions"
          git config --global user.email "actions@github.com"

          # public/ = index.html + fundamentals.html (folder path never fails if a file is missing)
          git add \
            nifty500_valuation.csv \
            niftymicrocap250_valuation.csv \
            niftysmallcap500_valuation.csv \
            multi_stock_news.csv \
            public/ || true
          [ -f EQUITY_L.csv ] && git add EQUITY_L.csv                         # NSE's list of every listed company
          [ -f Nifty_Others_Fundamentals.csv ] && git add Nifty_Others_Fundamentals.csv   # written by others.yml
          [ -f prices.csv ] && git add prices.csv          # Angel prices (Saturday, in thirds; ETF rows also by mode 4)
          [ -d etf_prices ] && git add etf_prices            # ETF raw candles + 365 days of daily closes (Portfolio Builder charts)
          [ -f etf_weekly_momentum.csv ] && git add etf_weekly_momentum.csv   # weekly composite momentum of the ETF ratios
          [ -f old_csv.zip ] && git add old_csv.zip
          # dated CSVs now live inside old_csv.zip → remove any loose ones from git
          git add -u -- '*.csv' || true

          git diff --cached --quiet && { echo "Nothing new to commit"; exit 0; }
          git commit -m "Auto update (${{ steps.mode.outputs.mode }}) [skip ci]"

          # Commit FIRST, then rebase onto whatever was pushed meanwhile (e.g. files you uploaded during the run).
          # -X theirs = in a clash, this run's freshly built files win. A rebase either finishes cleanly or is
          # aborted: it can never leave "<<<<<<<" conflict markers in the files (the old stash / pop could, and did).
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin main; then echo "Pushed"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::warning::Could not push this run's data (main kept changing). The site still deploys from this run."

      # Safety net: never publish a page with merge leftovers in it
      - name: Check public/ for conflict markers
        if: steps.mode.outputs.mode != 'prices'
        run: |
          if grep -rlE '^(<<<<<<<|=======|>>>>>>>)( |$)' public/ ; then
            echo "::error::Conflict markers found in the files above, not deploying"; exit 1
          fi
          echo "public/ is clean"

      # ───────────────────────────────────────────
      # 5. FIREBASE DEPLOY (all modes, always silent)
      # ───────────────────────────────────────────
      - name: Setup Firebase
        if: steps.mode.outputs.mode != 'prices'
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > serviceAccount.json
          npm install -g firebase-tools@15.34.0   # pinned: 15.34.1 (22 Oct 2026, 03:48 IST) needs an extra Google permission; see NOTES

      # "Delete user" from the website's Users list: removes the login accounts noted in hni_deletes
      - name: "🗑 Finish account deletions"
        if: steps.mode.outputs.mode != 'prices'
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: serviceAccount.json
        run: |
          pip install -q firebase-admin
          python account_deletes.py

      - name: Deploy to Firebase Hosting
        if: steps.mode.outputs.mode != 'prices'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: serviceAccount.json
        run: firebase deploy --project hnimanshu --only hosting --non-interactive 2>/dev/null

      # ───────────────────────────────────────────
      # 6. TELEGRAM  (token + channel id from repo secrets TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID)
      #    full  → success message / failure message
      #    light → one-liner
      #    build → "test run completed" one-liner
      #    continue-on-error: a Telegram hiccup never fails the run
      # ───────────────────────────────────────────
      - name: "📩 Telegram — full run success"
        if: steps.mode.outputs.mode == 'full' && success()
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="https://hnimanshu-value.web.app/ %0A%0AWeekly full update completed 🚀 (standalone + consolidated merged)"

      - name: "📩 Telegram — full run success (details)"
        if: steps.mode.outputs.mode == 'full' && success()
        continue-on-error: true
        run: |
          IST_NOW=$(TZ=Asia/Kolkata date '+%d %b %Y %I:%M %p IST')
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TG_CHAT}" \
            --data-urlencode text="✅ Full run completed successfully
          Repo: https://github.com/RPSCL/HNImanshu_value
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Time: ${IST_NOW}
          Site: https://hnimanshu-value.web.app/"

      - name: "📩 Telegram — light run"
        if: steps.mode.outputs.mode == 'light' && success()
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TG_CHAT}" \
            --data-urlencode text="https://hnimanshu-value.web.app/ website updated from github."

      - name: "📩 Telegram — test run (-1)"
        if: steps.mode.outputs.mode == 'build' && success()
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TG_CHAT}" \
            --data-urlencode text="🧪 Test run for https://hnimanshu-value.web.app/ completed"

      - name: "📩 Telegram — prices (2)"
        if: steps.mode.outputs.mode == 'prices' && always()
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TG_CHAT}" \
            --data-urlencode text="📈 Angel prices, part ${{ steps.mode.outputs.part }} of 3: ${{ steps.psum.outputs.msg || 'no summary — check the run log' }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: "📩 Telegram — ETF only (4)"
        if: steps.mode.outputs.mode == 'etf' && success()
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TG_CHAT}" \
            --data-urlencode text="📈 ETF prices + momentum updated: ${{ steps.esum.outputs.msg || 'done' }}
          Site: https://hnimanshu-value.web.app/builder.html
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: "📩 Telegram — ETF only (4) failed"
        if: steps.mode.outputs.mode == 'etf' && failure()
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="⚠️ ETF-only run FAILED — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: "📩 Telegram — full run failed"
        if: steps.mode.outputs.mode == 'full' && failure()
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="⚠️ Weekly full run FAILED — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
