name: Smart Build & Deploy

permissions:
  contents: write

# never let two runs commit at the same time (a light run waits for the weekly full run)
concurrency:
  group: smart-build
  cancel-in-progress: false

on:
  schedule:
    # 🚀 FULL — once a week, Saturday 00:00 IST  (= Friday 18:30 UTC)
    - cron: "30 18 * * 5"

    # 📰 Light — 00:00 IST every other night  (Sun–Thu + Sat UTC = Mon–Fri + Sun IST)
    - cron: "30 18 * * 0-4,6"

    # 📊 Light — trading day runs (Mon–Fri)
    - cron: "45 3 * * 1-5"   # 09:15 IST
    - cron: "45 4 * * 1-5"   # 10:15 IST
    - cron: "45 7 * * 1-5"   # 13:15 IST
    - cron: "00 8 * * 1-5"   # 13:30 IST

  workflow_dispatch:
    inputs:
      force_full:
        description: "Run mode:  0 = light  |  1 = FULL run  |  -1 = build + push only  |  2 = Angel prices only (test)"
        required: false
        type: choice
        default: "0"
        options:
          - "0"
          - "1"
          - "-1"
          - "2"

jobs:
  build:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 from 19 Oct 2026
    timeout-minutes: 330          # full run ≈ 1–1.5 h (≈1,250 stocks × 2 pages); GitHub max is 360
    env:
      # Telegram creds come from Settings → Secrets and variables → Actions (never written in this file)
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || vars.TELEGRAM_BOT_TOKEN }}   # Secrets tab first, falls back to Variables tab
      TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}

    steps:
      # ───────────────────────────────────────────
      # 1. SETUP
      # ───────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install requests pandas numpy beautifulsoup4 lxml tqdm gnews

      # ───────────────────────────────────────────
      # 2. DECIDE MODE
      #    Manual run (force_full):
      #       1  → full   (archive + scrape all 3 + Angel prices + build; no news)
      #       0  → light  (news + build)
      #      -1  → build  (build only, no news, no scrape)
      #    Schedule:
      #       Saturday 00:00 IST cron → full, every other cron → light
      #    github.event.schedule = the exact cron string that fired, so a late
      #    GitHub start (they are often 10–30 min late) still picks the right mode.
      # ───────────────────────────────────────────
      - name: Decide run mode
        id: mode
        run: |
          FORCE="${{ github.event.inputs.force_full }}"
          EVENT="${{ github.event_name }}"
          SCHED="${{ github.event.schedule }}"
          echo "event=$EVENT schedule='$SCHED' force=$FORCE  IST now: $(TZ=Asia/Kolkata date '+%a %d %b %H:%M')"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$FORCE" in
              1)  echo "mode=full"  >> $GITHUB_OUTPUT ;;
              -1) echo "mode=build" >> $GITHUB_OUTPUT ;;
              2)  echo "mode=prices" >> $GITHUB_OUTPUT ;;       # Angel prices only: fetch + commit prices.csv, no scrape / build / deploy
              *)  echo "mode=light" >> $GITHUB_OUTPUT ;;
            esac
            exit 0
          fi

          if [ "$EVENT" = "schedule" ] && [ "$SCHED" = "30 18 * * 5" ]; then
            echo "mode=full" >> $GITHUB_OUTPUT; exit 0
          fi

          echo "mode=light" >> $GITHUB_OUTPUT

      # ───────────────────────────────────────────
      # 3. RUN SCRIPTS
      #    archive_csv.py → snapshots the 3 CSVs into old_csv.zip as DDMMYY_<name>.csv
      #                     and moves any loose dated CSV into the zip
      #    n500 / nm250 / ns500 → scrape standalone + consolidated (parallel), merge,
      #                     upsert into the master CSV (each also snapshots its own CSV first)
      #    fetch_prices.py → prices.csv (Angel One: latest close, close 1 year back, 52W highs, splits)
      #    build.py → public/index.html + public/fundamentals.html
      # ───────────────────────────────────────────
      - name: "🚀 Full run (1) — scrape"
        if: steps.mode.outputs.mode == 'full'
        run: |
          python archive_csv.py
          python n500.py
          python nm250.py
          python ns500.py

      # Angel prices, at most once a week: fetch_prices.py --is-due checks prices.csv's FETCHED_AT and
      # says "due" only when it is ≥ 5 days old. Runs in full AND light runs, so whichever run comes first
      # after 5 days does it. Full run: after the scrape (1Y-back date = this week's data date − 365), before the build.
      # Mode 2 (manual prices test) passes --force so it always fetches.
      # Broker credentials go ONLY to this step (not job-wide), so npm / firebase never see them.
      # continue-on-error: if Angel fails, the build still runs with last week's prices.csv.
      - name: "📈 Fetch prices (Angel, weekly)"
        id: fetchpx
        if: (steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'light' || steps.mode.outputs.mode == 'prices') && hashFiles('fetch_prices.py') != ''
        continue-on-error: true
        timeout-minutes: 60
        env:
          ANGEL_API_KEY:     ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN:         ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
        run: |
          FORCE=""
          if [ "${{ steps.mode.outputs.mode }}" = "prices" ]; then FORCE="--force"; fi
          if python fetch_prices.py --is-due $FORCE; then
            echo "fetched=1" >> $GITHUB_OUTPUT
            pip install smartapi-python pyotp logzero websocket-client
            # prices-only run: archive first (a full run already did this before scraping)
            if [ "${{ steps.mode.outputs.mode }}" = "prices" ]; then python archive_csv.py; fi
            python -u fetch_prices.py $FORCE      # snapshots the old prices.csv into old_csv.zip, then writes the new one
          else
            echo "fetched=0" >> $GITHUB_OUTPUT
            echo "Angel fetch skipped: prices.csv is less than 5 days old"
          fi

      # summary of prices.csv (counts + first rows) in the log, and a one-line result for Telegram
      - name: "📊 prices.csv summary"
        id: psum
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'prices'
        continue-on-error: true
        run: |
          if [ ! -f prices.csv ]; then echo "prices.csv was NOT written"; echo "msg=prices.csv was NOT written — check the Fetch prices step log" >> $GITHUB_OUTPUT; exit 0; fi
          python - <<'EOF'
          import os, pandas as pd
          d = pd.read_csv("prices.csv")
          st = d["STATUS"].fillna("").astype(str)
          ok, nl = int(st.eq("OK").sum()), int(st.str.startswith("NOT LISTED").sum())
          fail = len(d) - ok - nl
          ca = int(d["CORP_ACTIONS"].fillna("").astype(str).str.len().gt(0).sum())
          b = d[d["SYMBOL"] == "^NIFTY500"]
          bench = f"NIFTY 500 {b['LTP'].iloc[0]} vs {b['PRICE_1Y'].iloc[0]} 1Y back" if len(b) and pd.notna(b["LTP"].iloc[0]) else "NIFTY 500 not found"
          msg = f"{len(d)} rows: {ok} OK, {nl} listed after the 1Y-back date, {fail} failed; {ca} splits/bonuses; {bench}"
          print(msg)
          print(d.head(8).to_string())
          print("Failed examples:", d[~st.eq("OK") & ~st.str.startswith("NOT LISTED")][["SYMBOL","STATUS"]].head(10).to_string(index=False))
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"msg={msg}\n")
          EOF

      - name: "🏗 Full run (1) — build"
        if: steps.mode.outputs.mode == 'full'
        run: |
          python build.py

      - name: "⚡ Light run — news + build (0)"
        if: steps.mode.outputs.mode == 'light'
        run: |
          python -u fetch_news.py
          python build.py

      - name: "🔨 Build only (-1)"
        if: steps.mode.outputs.mode == 'build'
        run: |
          python build.py

      # ───────────────────────────────────────────
      # 4. COMMIT & PUSH (all modes)
      # ───────────────────────────────────────────
      - name: Commit & push changes
        if: always()
        continue-on-error: true
        run: |
          git config --global user.name  "github-actions"
          git config --global user.email "actions@github.com"

          git stash   || true
          git pull origin main --rebase || true
          git stash pop || true

          # public/ = index.html + fundamentals.html (folder path never fails if a file is missing)
          git add \
            nifty500_valuation.csv \
            niftymicrocap250_valuation.csv \
            niftysmallcap500_valuation.csv \
            multi_stock_news.csv \
            public/ || true
          [ -f prices.csv ] && git add prices.csv          # weekly Angel prices (1Y back + same-method view)
          [ -f old_csv.zip ] && git add old_csv.zip
          # dated CSVs now live inside old_csv.zip → remove any loose ones from git
          git add -u -- '*.csv' || true

          git diff --cached --quiet || git commit -m "Auto update (${{ steps.mode.outputs.mode }}) [skip ci]"
          git push origin main || true

      # ───────────────────────────────────────────
      # 5. FIREBASE DEPLOY (all modes, always silent)
      # ───────────────────────────────────────────
      - name: Setup Firebase
        if: steps.mode.outputs.mode != 'prices'
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > serviceAccount.json
          npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        if: steps.mode.outputs.mode != 'prices'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: serviceAccount.json
        run: firebase deploy --project hnimanshu --only hosting --non-interactive 2>/dev/null

      # ───────────────────────────────────────────
      # 6. TELEGRAM  (token + channel id from repo secrets TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID)
      #    full  → success message / failure message
      #    light → one-liner
      #    build → "test run completed" one-liner
      #    continue-on-error: a Telegram hiccup never fails the run
      # ───────────────────────────────────────────
      - name: "📩 Telegram — full run success"
        if: steps.mode.outputs.mode == 'full' && success()
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="https://hnimanshu-value.web.app/ %0A%0AWeekly full update completed 🚀 (standalone + consolidated merged)"

      - name: "📩 Telegram — full run success (details)"
        if: steps.mode.outputs.mode == 'full' && success()
        continue-on-error: true
        run: |
          IST_NOW=$(TZ=Asia/Kolkata date '+%d %b %Y %I:%M %p IST')
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TG_CHAT}" \
            --data-urlencode text="✅ Full run completed successfully
          Repo: https://github.com/RPSCL/HNImanshu_value
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Time: ${IST_NOW}
          Site: https://hnimanshu-value.web.app/"

      - name: "📩 Telegram — light run"
        if: steps.mode.outputs.mode == 'light' && success()
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TG_CHAT}" \
            --data-urlencode text="https://hnimanshu-value.web.app/ website updated from github."

      - name: "📩 Telegram — test run (-1)"
        if: steps.mode.outputs.mode == 'build' && success()
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TG_CHAT}" \
            --data-urlencode text="🧪 Test run for https://hnimanshu-value.web.app/ completed"

      - name: "📩 Telegram — prices test (2)"
        if: steps.mode.outputs.mode == 'prices' && always()
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TG_CHAT}" \
            --data-urlencode text="📈 Angel prices test: ${{ steps.psum.outputs.msg || 'no summary — check the run log' }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: "📩 Telegram — full run failed"
        if: steps.mode.outputs.mode == 'full' && failure()
        continue-on-error: true
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d text="⚠️ Weekly full run FAILED — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
