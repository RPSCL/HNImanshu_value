name: Yearly prices (owner-earnings backtest)
run-name: "${{ github.event_name == 'schedule' && format('Back-up check {0}', github.event.schedule) || format('Yearly prices part {0}', inputs.part || '0') }}"

# fetch_prices.py --yearly → prices_yearly.csv: the split-adjusted close on 1 July of every year since 2019.
#   part 0 = the 3 lists (~765 stocks) + NIFTY 500 (~40 min) · parts 1 / 2 / 3 = a third of Others each (~620, ~35 min)
# Started by the Oracle server's crontab (oracle/crontab.txt, every Sunday 12:00-15:00 IST), or by hand: Actions → this workflow → Run
# workflow, pick the part. Each part rewrites only its own rows and commits prices_yearly.csv. Nothing on the site reads
# it yet: it is the price history for a multi-year owner-earnings backtest (the Factor screener's Historical covers 1.5 years).

permissions:
  contents: write

concurrency:
  group: smart-weekly            # same lane as the weekly scrape / price parts: never two Angel jobs at once
  cancel-in-progress: false

on:
  # 🛟 BACK-UP (GitHub's clock, UTC), 2 hours after each Oracle time (Sunday 12:00 / 13:00 / 14:00 / 15:00 IST):
  #    runs that part only if Oracle didn't start it
  schedule:
    - cron: "30 8 * * 0"       # Sunday 14:00 IST: part 0
    - cron: "30 9 * * 0"       # Sunday 15:00 IST: part 1
    - cron: "30 10 * * 0"      # Sunday 16:00 IST: part 2
    - cron: "30 11 * * 0"      # Sunday 17:00 IST: part 3
  workflow_dispatch:
    inputs:
      part:
        description: "0 = the 3 lists + NIFTY 500 (~765)  |  1 / 2 / 3 = Others, first / middle / last third"
        required: false
        default: "0"
      limit:
        description: "Only the first N stocks (quick test). Empty = all"
        required: false
        default: ""

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      go:   ${{ steps.g.outputs.go || 'true' }}
      part: ${{ steps.p.outputs.part }}
    steps:
      - name: Which part
        if: github.event_name == 'schedule'
        id: p
        run: |
          case "${{ github.event.schedule }}" in "30 8 * * 0") P=0 ;; "30 9 * * 0") P=1 ;; "30 10 * * 0") P=2 ;; *) P=3 ;; esac
          echo "part=$P" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v5
        if: github.event_name == 'schedule'
        with:
          sparse-checkout: .github/oracle_guard.sh
          sparse-checkout-cone-mode: false
      - name: Did the Oracle server start it?
        if: github.event_name == 'schedule'
        id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/oracle_guard.sh fcf_prices.yml 135 "^Yearly prices part ${{ steps.p.outputs.part }}"

  yearly:
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas numpy requests smartapi-python pyotp logzero websocket-client

      # Broker credentials go ONLY to this step
      - name: "📈 Yearly prices (Angel)"
        env:
          ANGEL_API_KEY:     ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN:         ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          LIMIT:             ${{ github.event.inputs.limit }}
          PART:              ${{ github.event.inputs.part || needs.guard.outputs.part }}
        run: |
          P="${PART:-0}"; case "$P" in 0|1|2|3) ;; *) echo "part must be 0-3"; exit 1 ;; esac
          ARGS="--yearly"; [ "$P" != "0" ] && ARGS="$ARGS --part $P"
          [ -n "$LIMIT" ] && ARGS="$ARGS --limit $LIMIT"
          python -u fetch_prices.py $ARGS

      - name: Commit & push prices_yearly.csv
        if: always()
        run: |
          [ -f prices_yearly.csv ] || { echo "No prices_yearly.csv"; exit 0; }
          git config --global user.name  "github-actions"
          git config --global user.email "actions@github.com"
          git add prices_yearly.csv
          git diff --cached --quiet && { echo "Nothing new"; exit 0; }
          git commit -m "Yearly prices, part ${{ github.event.inputs.part || needs.guard.outputs.part || '0' }} [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin main; then echo "Pushed"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::warning::Could not push prices_yearly.csv"
